<script>
const $=s=>document.querySelector(s);
const LV=['Básico','Aventurero','Explorador','Inversor','Experto'];
const C=[
{id:'c1',t:'Educación financiera para la vida',i:'📘',l:[['¿Qué es el dinero?','El dinero es un medio de intercambio: sirve para comprar, ahorrar e invertir. Usarlo bien empieza por saber cuánto entra y cuánto sale.'],['Ingresos y gastos','Ingreso es lo que recibes; gasto es lo que pagas. Separa los gastos necesarios (comida, transporte) de los gustos, y busca gastar menos de lo que ganas.'],['Ahorrar con un objetivo','Ahorrar es más fácil con una meta clara: un monto y una fecha. Separa tu ahorro apenas recibas dinero, no al final del mes.']],
q:[['¿Qué es un gasto?',['Dinero que recibes','Dinero que pagas','Dinero que ahorras'],1],['¿Qué conviene hacer primero al recibir dinero?',['Gastarlo todo','Separar tu ahorro','Prestarlo'],1],['Una buena meta de ahorro tiene...',['Monto y fecha','Solo un deseo','Ningún plazo'],0]]},
{id:'c2',t:'Uso de simuladores financieros',i:'💻',l:[['Para qué sirven los simuladores','Un simulador te deja probar números sin arriesgar dinero real. Cambia el ahorro, el tiempo o el interés y mira el resultado antes de decidir.'],['Interés compuesto','Con interés compuesto ganas intereses sobre tu dinero y también sobre los intereses anteriores. Mientras más tiempo pase, mayor es el efecto.']],
q:[['El interés compuesto significa que ganas intereses sobre...',['Solo tu aporte inicial','Tu aporte y los intereses ya ganados','Nada'],1],['Un simulador financiero sirve para...',['Garantizar ganancias','Probar escenarios antes de decidir','Reemplazar tu presupuesto'],1],['Si aumentas los años de ahorro, el resultado final normalmente...',['Crece','Baja','No cambia'],0]]},
{id:'c3',t:'Seguros y protección financiera',i:'🛡️',l:[['¿Qué es un seguro?','Un seguro es un acuerdo: pagas una prima y la aseguradora cubre ciertos riesgos, como salud, robo o accidentes.'],['Fondo de emergencia','Es dinero guardado solo para imprevistos. Una guía común es juntar entre 3 y 6 meses de tus gastos básicos.']],
q:[['Un seguro sirve para...',['Cubrir pérdidas por imprevistos','Ganar dinero rápido','Evitar los gastos'],0],['El fondo de emergencia se usa para...',['Compras de ocio','Imprevistos reales','Inversiones riesgosas'],1],['Una guía común es guardar un fondo de...',['3 a 6 meses de gastos','1 día de gastos','Tu sueldo de todo el año'],0]]}];
const CH=[['Registra tus gastos 3 días','Anota cada gasto durante tres días y revisa en qué se fue tu dinero.'],['Define una meta de ahorro','Elige algo que quieras comprar, su costo y una fecha.'],['Arma tu presupuesto del mes','Usa el simulador de presupuesto con tus datos reales.'],['Explica el interés compuesto','Cuéntaselo a un amigo con tus propias palabras.']];
const B=[['🌱','Primer paso','Completa una lección',d=>d.ls.length>=1],['🧮','Calculador','Usa un simulador',d=>d.sm.length>=1],['🧠','Cerebrito','Aprueba un quiz',d=>Object.values(d.qz).some(v=>v>=2)],['🏁','Retador','Completa un reto',d=>d.ch.length>=1],['⭐','Explorador','Llega a 100 puntos',d=>d.p>=100],['🏆','Experto','Llega a 400 puntos',d=>d.p>=400]];
const NAV=[['inicio','🏠','Inicio'],['cursos','📘','Mis cursos'],['simuladores','🎮','Simuladores'],['quizzes','📝','Quizzes'],['retos','🏁','Retos'],['recompensas','🏆','Recompensas']];

/* datos */
const U=()=>{try{return JSON.parse(localStorage.getItem('si_u')||'{}')}catch(e){return {}}};

let me=null,v='land',reg=false,sel=null,qsel=null,qres=null;

function add(n,t){save(x=>{x.d.p+=n;x.d.log.unshift([t,n,new Date().toLocaleDateString('es-PE')]);x.d.log=x.d.log.slice(0,5)});toast('+'+n+' puntos: '+t)}
const go=x=>{v=x;sel=qsel=qres=null;render();scrollTo(0,0)};
const lvl=p=>Math.min(4,Math.floor(p/100));
const cdone=(d,c)=>c.l.filter((_,i)=>d.ls.includes(c.id+i)).length;

/* sesión */
const ses=()=>localStorage.getItem('si_s')||sessionStorage.getItem('si_s');
const login=(e,k)=>(k?localStorage:sessionStorage).setItem('si_s',e);
const role=x=>x.r||'e';
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
let rol='e',rl0=0;
function doReg(){const n=$('#n').value.trim(),g=$('#g').value.trim(),c=$('#c')?$('#c').value.trim():'',e=$('#e').value.trim().toLowerCase(),p=$('#p').value;
 if(!n||!e.includes('@'))return $('#er').textContent='Escribe tu nombre y un correo válido.';
 if(rol!='e'&&(!c||!g))return $('#er').textContent='Escribe tu colegio y tu sección.';

function cardC(c){const d=cur().d,n=cdone(d,c),p=Math.round(n/c.l.length*100);

function inicio(){const x=cur(),d=x.d,l=lvl(d.p),mx=l==4,into=mx?100:d.p-l*100;
 const dn=C.filter(c=>cdone(d,c)==c.l.length).length,nb=B.filter(b=>b[3](d)).length;
 return `<h1>¡Hola, ${x.n.split(' ')[0]}! 👋</h1><p class="sub">Cada paso cuenta. Sigue avanzando.</p>
<div class="card lev"><div class="bdg">⭐</div><div style="flex:1"><h2>Nivel ${l+1}</h2><p class="m">${LV[l]} · ${d.p} puntos</p><div class="bar"><i style="width:${into}%"></i></div><p class="m s" style="margin-top:5px">${mx?'¡Nivel máximo!':into+' / 100 puntos para el siguiente nivel'}</p></div></div>

<h3>Tu progreso</h3><div class="card steps">${LV.map((n,i)=>`<div class="st ${i<l?'dn':i==l?'ac':''}"><div class="dt">${i<l?'✓':i==l?'★':'🔒'}</div>Nivel ${i+1}<small>${n}</small></div>`).join('')}</div>

function cursos(){const d=cur().d;
 if(sel){const c=C.find(k=>k.id==sel);

function simP(){const g=i=>+$('#'+i).value||0,ing=g('ig'),gs=g('g1')+g('g2')+g('g3')+g('g4'),a=ing-gs;
 if(ing<=0)return $('#r1').innerHTML='Escribe tu ingreso mensual.';

 if(ap<=0||y<=0)return $('#r2').innerHTML='Escribe un aporte y los años.';
 const r=t/1200,n=y*12,fv=r?ap*(Math.pow(1+r,n)-1)/r:ap*n,ti=ap*n,f=z=>'S/ '+z.toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});

function quizzes(){const d=cur().d;

${c.q.map((q,i)=>`<div class="card les"><h2>${i+1}. ${q[0]}</h2>${q[1].map((o,j)=>`<label class="opt ${qres?(j==q[2]?'ok':qres.a[i]==j?'no':''):''}"><input type="radio" name="q${i}" value="${j}" ${qres&&qres.a[i]==j?'checked':''} ${qres?'disabled':''}> ${o}</label>`).join('')}</div>`).join('')}
${qres?`<button class="btn" onclick="qres=null;render()">Intentar de nuevo</button>`:`<button class="btn" onclick="qsend()">Enviar respuestas</button>`}`}
 return `<h1>Quizzes</h1><p class="sub">Comprueba lo que aprendiste en cada curso.</p><div class="g3">${C.map(c=>{const b=d.qz[c.id];return `<div class="card cc"><div class="t"><span>📝</span>${c.t}</div><p class="m s">${c.q.length} preguntas · ${b==null?'Sin intentos':'Mejor resultado: '+b+'/'+c.q.length}</p><button class="btn" onclick="qsel='${c.id}';qres=null;render()">${b==null?'Empezar':'Repetir'}</button></div>`}).join('')}</div>`}
function qsend(){const c=C.find(k=>k.id==qsel),a=c.q.map((_,i)=>{const e=document.querySelector(`input[name=q${i}]:checked`);return e?+e.value:null});
 if(a.includes(null))return toast('Responde todas las preguntas');
 const s=a.filter((x,i)=>x==c.q[i][2]).length,prev=cur().d.qz[c.id];
 save(x=>{if(prev==null||s>prev)x.d.qz[c.id]=s});qres={a,s};
 if(s>=2&&!(prev>=2))add(40,'Quiz aprobado');render()}

function retos(){const d=cur().d;
 return `<h1>Retos</h1><p class="sub">Pon en práctica lo aprendido. Cada reto suma 30 puntos. (${d.ch.length} de ${CH.length} completados)</p><div class="g2">${CH.map((c,i)=>{const ok=d.ch.includes(i);return `<div class="card cc"><div class="t"><span>🏁</span>${c[0]}</div><p class="m">${c[1]}</p><button class="btn ${ok?'o':''}" ${ok?'disabled':''} onclick="reto(${i})">${ok?'✓ Completado':'Marcar como completado'}</button></div>`}).join('')}</div>`}
function reto(i){if(cur().d.ch.includes(i))return;save(x=>x.d.ch.push(i));add(30,'Reto completado');render()}

function recompensas(){const x=cur(),d=x.d,ok=d.p>=300;
 return `<h1>Recompensas</h1><p class="sub">Tienes ${d.p} puntos. Las insignias se desbloquean solas.</p><div class="g3">${B.map(b=>`<div class="card bd ${b[3](d)?'':'lk'}"><b>${b[0]}</b><h2>${b[1]}</h2><p class="m s">${b[2]}</p></div>`).join('')}</div>
<h3>Certificado digital</h3>${ok?`<div class="card cert"><p class="m">Sumaq Inti certifica que</p><h2>${x.n}</h2><p>completó la ruta de Educación Financiera con ${d.p} puntos.</p><p class="m s" style="margin:10px 0">${new Date().toLocaleDateString('es-PE')}</p><button class="btn noprint" onclick="print()">Imprimir o guardar PDF</button></div>`:`<div class="card"><p class="m">Consigue 300 puntos para desbloquear tu certificado. Te faltan <b>${300-d.p}</b>.</p></div>`}`}

/* portal docente */
let fil='Todos',bq='',sd=0,rs=[0,1,2],bim='III',cfg={ini:'2026-10-05',fin:'2026-10-09',comp:'Gestiona responsablemente los recursos económicos',av:true};
const R0=[['Lucía Quispe',7,92,0],['Mateo Ríos',5,70,1],['Valeria Soto',5,65,2],['Diego Paredes',3,50,4],['Camila Huamán',4,45,3],['Sebastián Mena',2,22,9],['Andrea Flores',6,78,0],['Joaquín Vera',1,10,12],['Renata Castro',5,68,1],['Bruno Salas',4,52,3],['Fernanda Ayala',6,76,0],['Gabriel Luna',3,40,5]];
const MN=['Ahorro','Billeteras digitales','Presupuesto','Crédito y deudas','Inversión básica'];
const RT=R0.map((r,i)=>{const a=r[2],q=i==0;return{n:r[0],v:r[1],a,d:r[3],e:r[3]<=2?'Al día':r[3]<=5?'Atrasado':'Sin actividad',m:q?[100,95,88,70,31]:[Math.min(100,a+18),Math.min(100,a+8),a,Math.max(0,a-12),Math.max(0,a-28)],s:q?[85,72]:[Math.round(a*.8+14),Math.round(a*.7+14)],r:q?12:Math.round(a/8),p:q?1240:a*14,l:Math.round(a*.6)}});
const RL=[['💰','Mi primer presupuesto mensual','Simulador · Presupuesto · 10 min',80,10,'#d6f0e3'],['📱','Yape con cabeza: ¿impulso o necesidad?','Microlearning · Billeteras digitales · 5 min',50,5,'#e5ddf1'],['🐷','Meta de ahorro de 4 semanas','Reto · Ahorro · 4 sesiones',120,20,'#ffe9a8'],['💳','¿Cuánto cuesta pagar en cuotas?','Simulador · Crédito y deudas · 12 min',90,12,'#fbd3df'],['📈','Interés simple vs. interés compuesto','Microlearning · Inversión básica · 5 min',60,5,'#cdeceb']];
const NT=[['panel','📊','Panel general'],['est','👥','Estudiantes'],['retosd','🎯','Retos y módulos'],['rep','📄','Reportes'],['conf','⚙️','Configuración']];
const av=a=>a.reduce((x,y)=>x+y,0)/a.length,pb=n=>`<div class="pb"><i style="width:${n}%"></i></div>`,fn=n=>n.split(' ')[0];
const ini=n=>n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase(),pl=(n,s,p)=>n+' '+(n==1?s:p);
const fe=d=>new Date(d+'T00:00').toLocaleDateString('es-PE',{day:'numeric',month:'long'}),fd=d=>new Date(d+'T00:00').toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'});

function shellT(c){const x=cur();return `<div class="app tp"><nav class="side" aria-label="Menú principal"><div class="bl"><img class="lg3" src="${LOGO}" alt=""><div><b>SUMAQ INTI</b><small>Portal ${x.r=='c'?'coordinador':'docente'}</small></div></div><div class="sch">🏫 ${esc(x.c)}</div>${NT.map(n=>`<button class="${v==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}</button>`).join('')}<div class="lic"><small>Licencia institucional activa</small><b>Vence: dic. 2026</b></div></nav><div class="main"><div class="top"><span class="chip">${esc(x.g)}</span><div class="avt" title="${esc(x.n)}">${ini(x.n)}</div></div>${c}<p class="ps" style="margin-top:14px;font-size:11px">Los datos de estudiantes son de ejemplo para la demo.</p></div></div>`}

function tPanel(){const x=cur(),t=x.t,N=RT.length,act=RT.filter(r=>r.d<7).length,al=N-act,lc=RT.filter(r=>r.s[1]<60).length,top=[...RT].sort((a,b)=>b.v-a.v)[0],A=t.asig[0];
 const mod=MN.map((n,i)=>[n,Math.round(av(RT.map(r=>r.m[i])))]),wk=[7,8,9,8,10,act],mx=Math.max(...wk,N),nm=top.n.split(' ');
 return `<h1>Hola, ${x.r=='c'?'Coord.':'Prof.'} ${esc(fn(x.n))} 👋</h1><p class="ps">Resumen de avance de tu sección esta semana</p>
<div class="k4">${[[act+'/'+N,'Estudiantes activos esta semana'],[Math.round(av(RT.map(r=>r.a)))+'%','Avance promedio de la sección'],[RT.reduce((s,r)=>s+r.r,0),'Retos completados'],['Nivel '+Math.round(av(RT.map(r=>r.v))),'Nivel promedio alcanzado']].map(k=>`<div class="pc"><b>${k[0]}</b><span>${k[1]}</span></div>`).join('')}</div>
<div class="g2p"><div class="pc"><h2>Avance por módulo</h2>${mod.map(m=>`<div class="mr"><span>${m[0]}</span>${pb(m[1])}<b>${m[1]}%</b></div>`).join('')}<h2 style="margin-top:22px">Actividad de las últimas 6 semanas</h2><div class="ch">${wk.map((w,i)=>`<div><i style="height:${w/mx*100}%" class="${i==5?'y':''}"></i><small>S${i+1}</small></div>`).join('')}</div></div>
<div class="pc"><h2 style="margin-bottom:12px">Alertas para ti</h2><div class="al a1">⚠️<span><b>${pl(al,'estudiante','estudiantes')}</b> sin actividad en los últimos 7 días.</span></div><div class="al a2">📉<span><b>${pl(lc,'estudiante','estudiantes')}</b> con puntaje bajo en el simulador de crédito.</span></div><div class="al a3">🏅<span><b>${nm[0]} ${nm[1][0]}.</b> alcanzó el nivel ${top.v} y desbloqueó la insignia «Ahorrista».</span></div><div class="al a4">📅<span>${A?(A.r.length>1?`Tus ${A.r.length} retos asignados vencen el <b>${fd(A.fin)}</b>.`:`El reto «${RL[A.r[0]][1]}» vence el <b>${fd(A.fin)}</b>.`):'Aún no asignaste retos. Hazlo en «Retos y módulos».'}</span></div><button class="pbtn" onclick="fil='alerta';go('est')">Ver estudiantes con alerta</button></div></div>`}

const flt=()=>RT.map((r,i)=>[r,i]).filter(([r])=>(fil=='Todos'||(fil=='alerta'?r.e!='Al día':r.e==fil))&&r.n.toLowerCase().includes(bq.toLowerCase()));
const rows=()=>{const hoy=d=>d==0?'Hoy':d==1?'Ayer':'Hace '+d+' días',cl={'Al día':'ok','Atrasado':'wa','Sin actividad':'no'};
 return flt().map(([r,i])=>`<tr class="${i==sd?'sel':''}" tabindex="0" onclick="sd=${i};render()" onkeydown="if(event.key=='Enter'){sd=${i};render()}"><td><b>${r.n}</b></td><td>${r.v}</td><td style="width:26%">${pb(r.a)}</td><td>${hoy(r.d)}</td><td><span class="chp ${cl[r.e]}">${r.e}</span></td></tr>`).join('')||'<tr><td colspan="5">Sin resultados.</td></tr>'};
const upd=()=>{$('#tb').innerHTML=rows();$('#cnt').textContent='Mostrando '+flt().length+' de '+RT.length};
function tEst(){const x=cur(),r=RT[sd],nt=x.t.notas[r.n]||[];
 return `<div class="ph"><div><h1>Seguimiento por estudiante</h1><p class="ps">${esc(x.g)} · ${RT.length} estudiantes</p></div><div class="ctr"><input id="bq" placeholder="🔍 Buscar estudiante" aria-label="Buscar estudiante" value="${esc(bq)}" oninput="bq=this.value;upd()"><select aria-label="Estado" onchange="fil=this.value;render()">${[['Todos','Estado: Todos'],['Al día','Al día'],['Atrasado','Atrasado'],['Sin actividad','Sin actividad'],['alerta','Con alerta']].map(o=>`<option value="${o[0]}" ${o[0]==fil?'selected':''}>${o[1]}</option>`).join('')}</select></div></div>
<div class="g2e"><div class="pc" style="overflow-x:auto"><table class="tt"><thead><tr><th>Estudiante</th><th>Nivel</th><th>Avance</th><th>Última actividad</th><th>Estado</th></tr></thead><tbody id="tb">${rows()}</tbody></table><p class="ps" id="cnt" style="text-align:center;margin:12px 0 0">Mostrando ${flt().length} de ${RT.length}</p></div>
<div class="pc"><div class="dh"><div class="avt">${ini(r.n)}</div><div><h2>${r.n}</h2><small class="ps">${esc(x.g)} · Nivel ${r.v} · ${r.p.toLocaleString('es-PE')} puntos</small></div></div><div style="margin-bottom:12px">${r.m[0]>=90?'<span class="chp lil">🏅 Ahorrista</span> ':''}<span class="chp lil">🎯 ${pl(r.r,'reto','retos')}</span></div>
<h2 style="margin-bottom:6px">Progreso por módulo</h2>${MN.slice(0,4).map((n,i)=>`<div class="mr" style="grid-template-columns:90px 1fr 40px"><span>${n.split(' ')[0]}</span>${pb(r.m[i])}<b>${r.m[i]}%</b></div>`).join('')}
<h2 style="margin:14px 0 4px">Resultados en simuladores</h2><div class="sr"><span>Planificador de presupuesto</span><b>${r.s[0]}/100</b></div><div class="sr"><span>Simulador de crédito</span><b>${r.s[1]}/100</b></div>
${nt.length?`<h2 style="margin:14px 0 4px">Historial</h2>${nt.slice(0,3).map(z=>`<div class="sr"><span>${z[0]=='m'?'✉️':'📝'} ${esc(z[1])}</span><small>${z[2]}</small></div>`).join('')}`:''}
<div style="display:flex;gap:8px;margin-top:14px"><button class="pbtn" onclick="nota('m')">Enviar mensaje</button><button class="pbtn o" onclick="nota('o')">Agregar observación</button></div></div></div>`}
function nota(t){const n=RT[sd].n,z=prompt((t=='m'?'Mensaje para ':'Observación sobre ')+n);if(!z||!z.trim())return;
 save(u=>{(u.t.notas[n]=u.t.notas[n]||[]).unshift([t,z.trim(),new Date().toLocaleDateString('es-PE')])});toast(t=='m'?'Mensaje guardado en el historial':'Observación guardada');render()}

const tg=i=>{rs=rs.includes(i)?rs.filter(k=>k!=i):[...rs,i];render()};
function asig(){if(!rs.length)return toast('Selecciona al menos un reto');if(!cfg.ini||!cfg.fin||cfg.fin<cfg.ini)return toast('Revisa las fechas de inicio y vencimiento');
 save(u=>{u.t.asig.unshift({r:[...rs],ini:cfg.ini,fin:cfg.fin,comp:cfg.comp,av:cfg.av});u.t.draft=null});rs=[];toast('Retos asignados a la sección');render()}
function draft(){save(u=>{u.t.draft={rs:[...rs],cfg:{...cfg}}});toast('Borrador guardado')}
function tRetos(){const x=cur(),t=x.t;if(!rl0){rl0=1;if(t.draft){rs=t.draft.rs;cfg=t.draft.cfg}}
 const tot=rs.reduce((s,i)=>s+RL[i][4],0),L=t.asig[0];
 return `<h1>Asignar retos de la semana</h1><p class="ps">Elige qué practicarán tus estudiantes y para cuándo</p>
<div class="g2e"><div class="pc"><h2>Biblioteca de retos <small style="font-weight:400;color:#7b6890">· ${rs.length} seleccionados</small></h2><div style="margin-top:12px">${RL.map((c,i)=>{const on=rs.includes(i);return `<label class="rc ${on?'on':''}"><input type="checkbox" ${on?'checked':''} onchange="tg(${i})"><span class="ri" style="background:${c[5]}">${c[0]}</span><span class="rt">${c[1]}<small>${c[2]}</small></span><span class="chp yl">+${c[3]} pts</span></label>`}).join('')}</div></div>
<div class="pc fm"><h2>Configuración de la asignación</h2><label for="sc">Sección</label><input id="sc" value="${esc(x.g)} · ${RT.length} estudiantes" readonly><div class="dg"><div><label for="d1">Inicia</label><input id="d1" type="date" value="${cfg.ini}" onchange="cfg.ini=this.value"></div><div><label for="d2">Vence</label><input id="d2" type="date" value="${cfg.fin}" onchange="cfg.fin=this.value"></div></div><label for="cp">Competencia vinculada (CNEB)</label><input id="cp" value="${esc(cfg.comp)}" oninput="cfg.comp=this.value"><label class="sw2"><span>🔔 Avisar a los estudiantes en la app</span><input type="checkbox" ${cfg.av?'checked':''} onchange="cfg.av=this.checked"></label><p class="ps">Tiempo estimado total: ≈ ${tot} min repartidos en la semana.</p><button class="pbtn y" onclick="asig()">Asignar a la sección</button><div style="height:10px"></div><button class="pbtn o" onclick="draft()">Guardar borrador</button>${L?`<p class="ps" style="margin:12px 0 0">Última asignación: ${pl(L.r.length,'reto','retos')}, vence el ${fe(L.fin)}.</p>`:''}</div></div>`}

const fname=()=>'Informe_'+(cur().g||'').replace(/[^A-Za-z0-9]/g,'')+'_'+bim+'Bimestre';
function xls(){const h=['Estudiante','Nivel','Avance %','Última actividad (días)','Estado','Retos','Puntos',...MN,'Sim. presupuesto','Sim. crédito'],rw=RT.map(r=>[r.n,r.v,r.a,r.d,r.e,r.r,r.p,...r.m,...r.s]),
 csv='\ufeff'+[h,...rw].map(r=>r.join(';')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=fname()+'.csv';a.click();toast('Archivo descargado (abre con Excel)')}
function mail(){const N=RT.length,b=`Resumen ${bim} Bimestre · ${cur().g}\n- Avance promedio: ${Math.round(av(RT.map(r=>r.a)))}%\n- Retos completados: ${RT.reduce((s,r)=>s+r.r,0)}\n- Estudiantes sin actividad en 7 días: ${RT.filter(r=>r.d>=7).length} de ${N}`;
 location.href='mailto:?subject='+encodeURIComponent('Informe '+cur().g+' · '+bim+' Bimestre')+'&body='+encodeURIComponent(b)}
function tRep(){const x=cur(),g={AD:0,A:0,B:0,C:0},cl={AD:'#4f2a6b',A:'#7fb8a2',B:'#ffc845',C:'#e473a3'},m=i=>av(RT.map(r=>r.m[i])),c1=Math.round((m(0)+m(1))/2),c2=Math.round((m(2)+m(3)+m(4))/3);
 RT.forEach(r=>g[r.a>=85?'AD':r.a>=65?'A':r.a>=40?'B':'C']++);
 return `<div class="ph"><div><h1>Reportes y evidencias</h1><p class="ps">Evidencia de logro para tu registro y para la dirección</p></div><div class="ctr"><select aria-label="Bimestre" onchange="bim=this.value;render()">${['I','II','III','IV'].map(b=>`<option value="${b}" ${b==bim?'selected':''}>${b} Bimestre</option>`).join('')}</select></div></div>
<div class="pc" style="margin-bottom:14px"><h2>Competencia: Gestiona responsablemente los recursos económicos</h2><p class="ps" style="margin:6px 0 0">Distribución de estudiantes por nivel de logro (AD ≥85 %, A ≥65 %, B ≥40 %, C &lt;40 % de avance)</p><div class="sg">${Object.keys(g).filter(k=>g[k]).map(k=>`<div style="flex:${g[k]};background:${cl[k]}">${k} · ${g[k]}</div>`).join('')}</div></div>
<div class="g2e"><div class="pc"><h2>Capacidades evaluadas</h2><div class="cr"><span>Comprende las relaciones entre los elementos del sistema económico y financiero</span>${pb(c1)}<b>${c1}%</b></div><div class="cr"><span>Toma decisiones económicas y financieras</span>${pb(c2)}<b>${c2}%</b></div>
<h2 style="margin:20px 0 6px">Evidencias generadas por la app</h2><table class="tt"><thead><tr><th>Evidencia</th><th>Registros</th></tr></thead><tbody><tr><td>Retos completados</td><td><b>${RT.reduce((s,r)=>s+r.r,0)}</b></td></tr><tr><td>Resultados de simuladores</td><td><b>${RT.length*2}</b></td></tr><tr><td>Lecciones de microlearning vistas</td><td><b>${RT.reduce((s,r)=>s+r.l,0)}</b></td></tr></tbody></table></div>
<div class="pc"><h2 style="margin-bottom:12px">Exportar reporte</h2><div class="ex"><b>📄 ${fname()}.pdf</b><br>Incluye nivel de logro por estudiante, capacidades y retos completados.</div><div class="noprint"><button class="pbtn" onclick="print()">⬇ Descargar PDF</button><div style="height:8px"></div><button class="pbtn o" onclick="xls()">📊 Exportar a Excel</button><div style="height:8px"></div><button class="pbtn y" onclick="mail()">✉ Compartir con dirección</button></div></div></div>`}

function svc(){const n=$('#cn').value.trim(),c=$('#cc').value.trim(),g=$('#cs').value.trim();if(!n||!c||!g)return toast('Completa todos los campos');save(u=>{u.n=n;u.c=c;u.g=g});toast('Cambios guardados');render()}
function tConf(){const x=cur();return `<h1>Configuración</h1><p class="ps">Datos de tu cuenta y de tu sección</p><div class="pc fm" style="max-width:480px"><label for="cn">Nombre</label><input id="cn" value="${esc(x.n)}"><label for="cc">Colegio</label><input id="cc" value="${esc(x.c)}"><label for="cs">Sección</label><input id="cs" value="${esc(x.g)}"><div style="height:16px"></div><button class="pbtn y" onclick="svc()">Guardar cambios</button><div style="height:10px"></div><button class="pbtn o" onclick="out()">Cerrar sesión</button></div>`}
const TV={panel:tPanel,est:tEst,retosd:tRetos,rep:tRep,conf:tConf};

const VIEWS={inicio,cursos,simuladores,quizzes,retos,recompensas};
function render(){me=ses();if(me&&!U()[me])me=null;const a=$('#app');
 if(!me){if(v!='auth')v='land';a.innerHTML=v=='auth'?AUTH():LAND();return}
 const x=cur();if(role(x)!='e'){if(!TV[v])v='panel';a.innerHTML=shellT(TV[v]());return}if(v=='land'||v=='auth'||!VIEWS[v])v='inicio';
 a.innerHTML=`<div class="app"><nav class="side"><div class="logo">☀️ SUMAQ <span>INTI</span></div>${NAV.map(n=>`<button class="${v==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}</button>`).join('')}</nav><div class="main"><div class="top"><div class="av">${x.n.charAt(0)}</div><div>${x.n}<small class="m" style="display:block">${x.g||''}</small></div><button class="btn o" onclick="out()">Salir</button></div>${VIEWS[v]()}</div></div>`}
render();
